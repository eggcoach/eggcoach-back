spring:
  application:
    name: eggcoach
  datasource:
    url: jdbc:mysql://localhost:3306/eggcoach
    username: root
    password: 'pepelu18'
    driver-class-name: com.mysql.cj.jdbc.Driver
    sql:
      init:
        mode: never
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          auto: update
        default_batch_fetch_size: 1000
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher